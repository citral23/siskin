---
name: siskin
description: test

base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: latest

modules:
  - type: containerfile
    snippets:
      - COPY --from=ghcr.io/armada-os/armada-packages/kernel:latest /kernel /tmp/kernel
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - install-kernel.sh
      - vendor.sh
      - create-user.sh
      - generate-initramfs.sh
      

  - type: dnf
    repos:
      nonfree: negativo17
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      packages:
        - adw-gtk3-theme 
        - bat
        - brave-origin
        - brightnessctl
        - btop
        - cargo
        - cava
        - chezmoi
        - cliphist
        - ddcutil
        - dialog
        - eog
        - fastfetch
        - fex-emu
        - fex-emu-rootfs-fedora
        - fex-emu-thunks
        - fex-emu-utils
        - fira-code-fonts
        - freerdp
        - fuse-libs
        - gamescope
        - gnome-calculator
        - gnome-clocks
        - gnome-disk-image-mounter
        - gnome-disks
        - gnome-keyring-pam
        - gparted
        - greetd
        - gvfs-archive
        - gvfs-gphoto2
        - jetbrainsmono-nerd-fonts
        - kitty
        - lm_sensors
        - mangohud
        - mediawriter
        - mpv
        - nautilus
        - nethogs
        - NetworkManager-openconnect
        - NetworkManager-openvpn
        - niri
        - nmap-ncat
        - noctalia
        - noctalia-greeter
        - openvpn-otp
        - papers
        - polkit-gnome
        - powertop
        - python3-pip
        - qt6ct
        - screen
        - system-config-printer
        - tailscale
        - telnet
        - uupd
        - v4l-utils
        - vim
        - vulkan-tools
        - wayvnc
        - wlsunset
        - xdotool
        - xwininfo
        - yad
        - yazi
        - zed

    remove:
      packages:
        - htop
        - power-profiles-daemon

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.ranfdev.DistroShelf
          - io.github.flattool.Ignition
          - org.gtk.Gtk3theme.adw-gtk3
          - org.gtk.Gtk3theme.adw-gtk3-dark
          - org.remmina.Remmina
          - page.codeberg.libre_menu_editor.LibreMenuEditor
          - io.github.kolunmi.Bazaar
          - io.missioncenter.MissionCenter
          - com.github.tchx84.Flatseal
          - org.atheme.audacious
          - page.tesk.Refine

  - type: signing

  - type: systemd
    system:
      enabled:
        - greetd
        - sshd
        - tailscaled
        - armada-powerd
        - armada-device-quirks
        - armada-bootimg-sync
      masked:
        - irqbalance
        - bootloader-update
        - systemd-suspend
        - systemd-hibernate
        - systemd-hybrid-sleep
        - systemd-suspend-then-hibernate

  - type: kargs
    kargs:
      - mitigations=off split_lock_detect=off rootflags=noatime,compress=zstd:1 console=tty0 allow_mismatched_32bit_el0 fw_devlink.strict=1 pcie_ports=compat psi=1 cgroup_disable=pressure cgroup.memory=nokmem,nosocket cpufreq.default_governor=schedutil swiotlb=8192 console=ttyS0
